<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🕌 Namaz Time Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 22px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 18px;
        }
        .header h1 { color: #fff; font-size: 26px; font-weight: 700; }
        .header h1 span { color: #00e5ff; }
        .header .badge {
            background: rgba(0,229,255,0.12);
            color: #00e5ff;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
            border: 1px solid rgba(0,229,255,0.15);
        }
        .header p { color: #8892b0; font-size: 13px; margin-top: 4px; }

        .status-bar {
            background: transparent !important;
            padding: 8px 14px;
            margin-bottom: 12px;
            color: #ccd6f6;
            font-size: 13px;
            border-left: 3px solid #fcc419;
        }
        .status-bar.success { border-left-color: #69db7c; color: #69db7c; }
        .status-bar.error { border-left-color: #ff6b6b; color: #ff6b6b; }
        .status-bar.loading { border-left-color: #fcc419; color: #fcc419; }

        /* ===== MAIN BOX ===== */
        .main-box {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .main-box .box-title {
            color: #64ffda;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .main-box .box-title i { color: #64ffda; }
        .main-box .box-title span {
            background: rgba(100,255,218,0.08);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: #64ffda;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .time-item {
            text-align: center;
        }
        .time-item label {
            display: block;
            color: #8892b0;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .time-item input {
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 4px;
            color: #ffffff !important;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            text-align: center;
            transition: 0.2s;
            outline: none;
        }
        .time-item input:focus {
            border-color: #00e5ff;
            background: rgba(255,255,255,0.1);
        }
        .time-item input.changed {
            border-color: #fcc419;
            background: rgba(252,196,25,0.08);
        }
        .time-item input::placeholder { color: #5a6a8a; font-size: 11px; }

        /* ===== GOLD ANIMATED FRIDAY BOX ===== */
        .friday-box {
            background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,215,0,0.02));
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            animation: goldGlow 2s ease-in-out infinite;
        }
        .friday-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(255,215,0,0.05),
                transparent,
                rgba(255,215,0,0.05),
                transparent
            );
            animation: goldRotate 4s linear infinite;
        }
        .friday-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                transparent 30%,
                rgba(255,215,0,0.04) 50%,
                transparent 70%
            );
            animation: goldShine 3s ease-in-out infinite;
        }
        .friday-box .box-title,
        .friday-box .friday-single {
            position: relative;
            z-index: 2;
        }

        @keyframes goldGlow {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(255,215,0,0.15), inset 0 0 15px rgba(255,215,0,0.05);
                border-color: #ffd700;
            }
            50% { 
                box-shadow: 0 0 30px rgba(255,215,0,0.25), inset 0 0 25px rgba(255,215,0,0.08);
                border-color: #ffed4a;
            }
        }
        @keyframes goldRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes goldShine {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .friday-box .box-title {
            color: #ffd700;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(255,215,0,0.2);
        }
        .friday-box .box-title i {
            color: #ffd700;
            animation: goldPulse 1.5s ease-in-out infinite;
        }
        @keyframes goldPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .friday-box .box-title span {
            background: rgba(255,215,0,0.12);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 10px;
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.15);
        }

        .friday-single {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .friday-single label {
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255,215,0,0.1);
        }
        .friday-single input {
            background: rgba(255,215,0,0.06);
            border: 1.5px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            padding: 8px 16px;
            color: #ffffff !important;
            font-size: 16px;
            font-weight: 600;
            width: 140px;
            transition: all 0.15s;
            text-align: center;
            outline: none;
        }
        .friday-single input:hover { 
            border-color: rgba(255,215,0,0.4); 
            background: rgba(255,215,0,0.08);
        }
        .friday-single input:focus {
            border-color: #ffd700;
            background: rgba(255,215,0,0.08);
            box-shadow: 0 0 20px rgba(255,215,0,0.08);
        }
        .friday-single input.changed {
            border-color: #ffd700;
            background: rgba(255,215,0,0.1);
            box-shadow: 0 0 25px rgba(255,215,0,0.1);
        }
        .friday-single input::placeholder { color: #6a7a8a; opacity: 1; }
        .friday-single .friday-badge {
            background: rgba(255,215,0,0.08);
            color: #ffd700;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 10px;
            border: 1px solid rgba(255,215,0,0.08);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 12px 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .action-bar button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #8892b0;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            font-weight: 500;
        }
        .action-bar button:hover { background: rgba(255,255,255,0.08); color: #ccd6f6; }
        .action-bar .badge {
            background: rgba(105,219,124,0.08);
            color: #69db7c;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00e5ff, #00b8cc);
            border: none;
            border-radius: 14px;
            color: #0f0f1a;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,229,255,0.15); }
        .btn-save:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .footer {
            text-align: center;
            margin-top: 14px;
            color: #495670;
            font-size: 11px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .footer a { color: #00e5ff; text-decoration: none; cursor: pointer; }

        @media (max-width: 500px) {
            .time-grid { grid-template-columns: repeat(3, 1fr); }
            .friday-single input { width: 110px; font-size: 14px; }
        }
        @media (max-width: 380px) {
            .time-grid { grid-template-columns: repeat(2, 1fr); }
            .friday-single input { width: 90px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🕌 Namaz <span>Time</span></h1>
        <div class="badge">⚡ Admin Panel</div>
        <p>Edit & Sync with Firebase</p>
    </div>

    <div class="status-bar loading" id="statusBar">
        <span>⏳</span> Loading timings...
    </div>

    <!-- ===== MAIN BOX (Monday) ===== -->
    <div class="main-box">
        <div class="box-title">
            <i class="fas fa-calendar-day"></i> Monday <span>Default</span>
        </div>
        <div class="time-grid">
            <div class="time-item">
                <label>Fajr</label>
                <input type="text" id="fajr" placeholder="5:30 AM" />
            </div>
            <div class="time-item">
                <label>Dhuhr</label>
                <input type="text" id="dhuhr" placeholder="12:30 PM" />
            </div>
            <div class="time-item">
                <label>Asr</label>
                <input type="text" id="asr" placeholder="4:00 PM" />
            </div>
            <div class="time-item">
                <label>Maghrib</label>
                <input type="text" id="maghrib" placeholder="6:30 PM" />
            </div>
            <div class="time-item">
                <label>Isha</label>
                <input type="text" id="isha" placeholder="8:00 PM" />
            </div>
        </div>
    </div>

    <!-- ===== GOLD ANIMATED FRIDAY BOX ===== -->
    <div class="friday-box">
        <div class="box-title">
            <i class="fas fa-star"></i> Friday <span>⭐ Special Day</span>
        </div>
        <div class="friday-single">
            <label>Fajr</label>
            <input type="text" id="friday-fajr" placeholder="5:22 AM" />
            <span class="friday-badge">Jumma</span>
        </div>
    </div>

    <div class="action-bar">
        <div>
            <button onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button onclick="clearCache()"><i class="fas fa-trash"></i> Clear</button>
        </div>
        <span class="badge" id="cacheBadge">📡 Firebase</span>
    </div>

    <button class="btn-save" id="saveBtn" onclick="saveToFirebase()">
        💾 Save to Firebase
    </button>

    <div class="footer">
        <span>🔄 Auto-sync every 30s</span>
        <span style="margin-left: 12px;">•</span>
        <a onclick="loadData()">⟳ Refresh</a>
    </div>
</div>

<script>
// ========================================
// ADMIN PANEL - 1 BOX + Jumma BOX
// ========================================

// --- CONFIG ---
const DB_URL = 'https://namaztimedata-default-rtdb.firebaseio.com/namaz.json';

const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const TIME_IDS = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];

// --- STATE ---
let currentData = {};
let isSaving = false;

const statusBar = document.getElementById('statusBar');
const saveBtn = document.getElementById('saveBtn');
const cacheBadge = document.getElementById('cacheBadge');

// ========================================
// UI FUNCTIONS
// ========================================
function setStatus(msg, type = 'loading') {
    statusBar.className = `status-bar ${type}`;
    const icons = { loading: '⏳', success: '✅', error: '❌', warning: '⚠️' };
    statusBar.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg}`;
}

function clearCache() {
    localStorage.removeItem('namaz_backup');
    localStorage.removeItem('namaz_last_update');
    sessionStorage.clear();
    setStatus('🗑️ Cache cleared!', 'info');
    setTimeout(loadData, 300);
}

// ========================================
// LOAD DATA FROM FIREBASE
// ========================================
async function loadData() {
    setStatus('Loading from Firebase...', 'loading');
    saveBtn.disabled = true;

    try {
        const response = await fetch(DB_URL, {
            cache: 'no-cache',
            headers: { 'Cache-Control': 'no-cache, no-store' }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();

        if (data && typeof data === 'object' && Object.keys(data).length > 0) {
            const hasValidData = DAYS.some(day => data[day] && typeof data[day] === 'object');
            if (hasValidData) {
                currentData = data;
                renderTimings(data);
                setStatus('✅ Loaded from Firebase!', 'success');
                cacheBadge.textContent = '📡 Firebase';
                saveBtn.disabled = false;
                return;
            }
        }

        // Use default data
        currentData = getDefaultData();
        renderTimings(currentData);
        setStatus('⚠️ Using default data', 'warning');
        cacheBadge.textContent = '📂 Default';
        saveBtn.disabled = false;

    } catch (error) {
        setStatus('⚠️ Error: ' + error.message, 'error');
        const backup = localStorage.getItem('namaz_backup');
        if (backup) {
            try {
                const parsed = JSON.parse(backup);
                if (parsed && typeof parsed === 'object') {
                    currentData = parsed;
                    renderTimings(parsed);
                    setStatus('📂 Using cached data', 'warning');
                    saveBtn.disabled = false;
                    return;
                }
            } catch (e) {}
        }
        currentData = getDefaultData();
        renderTimings(currentData);
        setStatus('📂 Default data (offline)', 'warning');
        saveBtn.disabled = false;
    }
}

// ========================================
// GET DEFAULT DATA
// ========================================
function getDefaultData() {
    return {
        "Monday": { "fajr": "5:30 AM", "dhuhr": "12:30 PM", "asr": "4:00 PM", "maghrib": "6:30 PM", "isha": "8:00 PM" },
        "Tuesday": { "fajr": "5:28 AM", "dhuhr": "12:32 PM", "asr": "4:02 PM", "maghrib": "6:32 PM", "isha": "8:02 PM" },
        "Wednesday": { "fajr": "5:26 AM", "dhuhr": "12:34 PM", "asr": "4:04 PM", "maghrib": "6:34 PM", "isha": "8:04 PM" },
        "Thursday": { "fajr": "5:24 AM", "dhuhr": "12:36 PM", "asr": "4:06 PM", "maghrib": "6:36 PM", "isha": "8:06 PM" },
        "Friday": { "fajr": "5:22 AM", "dhuhr": "12:38 PM", "asr": "4:08 PM", "maghrib": "6:38 PM", "isha": "8:08 PM" },
        "Saturday": { "fajr": "5:20 AM", "dhuhr": "12:40 PM", "asr": "4:10 PM", "maghrib": "6:40 PM", "isha": "8:10 PM" },
        "Sunday": { "fajr": "5:18 AM", "dhuhr": "12:42 PM", "asr": "4:12 PM", "maghrib": "6:42 PM", "isha": "8:12 PM" }
    };
}

// ========================================
// RENDER TIMINGS
// ========================================
function renderTimings(data) {
    const monday = data['Monday'] || {};
    document.getElementById('fajr').value = monday.fajr || '';
    document.getElementById('dhuhr').value = monday.dhuhr || '';
    document.getElementById('asr').value = monday.asr || '';
    document.getElementById('maghrib').value = monday.maghrib || '';
    document.getElementById('isha').value = monday.isha || '';

    const friday = data['Friday'] || {};
    document.getElementById('friday-fajr').value = friday.fajr || '';

    document.querySelectorAll('.changed').forEach(el => el.classList.remove('changed'));
}

// ========================================
// GET UPDATED DATA
// ========================================
function getUpdatedData() {
    const updated = {};
    
    // Get Monday timings from main box
    const mainTimings = {
        fajr: document.getElementById('fajr').value || '',
        dhuhr: document.getElementById('dhuhr').value || '',
        asr: document.getElementById('asr').value || '',
        maghrib: document.getElementById('maghrib').value || '',
        isha: document.getElementById('isha').value || ''
    };
    
    // Get Friday Fajr from special box
    const fridayFajr = document.getElementById('friday-fajr').value || '';
    
    // Apply to all days
    DAYS.forEach(day => {
        if (day === 'Friday') {
            updated[day] = {
                fajr: fridayFajr || mainTimings.fajr,
                dhuhr: mainTimings.dhuhr,
                asr: mainTimings.asr,
                maghrib: mainTimings.maghrib,
                isha: mainTimings.isha
            };
        } else {
            updated[day] = {
                fajr: mainTimings.fajr,
                dhuhr: mainTimings.dhuhr,
                asr: mainTimings.asr,
                maghrib: mainTimings.maghrib,
                isha: mainTimings.isha
            };
        }
    });
    
    return updated;
}

// ========================================
// SAVE TO FIREBASE
// ========================================
async function saveToFirebase() {
    if (isSaving) return;

    const updated = getUpdatedData();

    // Check if anything changed
    let hasChanges = false;
    DAYS.forEach(day => {
        TIME_IDS.forEach(id => {
            if (updated[day][id] !== currentData[day]?.[id]) {
                hasChanges = true;
            }
        });
    });

    if (!hasChanges) {
        setStatus('⚠️ No changes detected', 'warning');
        return;
    }

    setStatus('⏳ Saving to Firebase...', 'loading');
    saveBtn.disabled = true;
    isSaving = true;

    try {
        const response = await fetch(DB_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updated)
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        currentData = updated;
        localStorage.setItem('namaz_backup', JSON.stringify(updated));

        setStatus('✅ Saved to Firebase! 🎉', 'success');
        document.querySelectorAll('.changed').forEach(el => el.classList.remove('changed'));
        cacheBadge.textContent = '📡 Firebase';

        // Notify other tabs
        try {
            if (typeof BroadcastChannel !== 'undefined') {
                const channel = new BroadcastChannel('namaz_updates');
                channel.postMessage({ type: 'update', data: updated });
                channel.close();
            }
        } catch (e) {}
        localStorage.setItem('namaz_update_flag', 'true');

        setTimeout(() => loadData(), 800);

    } catch (error) {
        setStatus('❌ Error: ' + error.message, 'error');
    } finally {
        saveBtn.disabled = false;
        isSaving = false;
    }
}

// ========================================
// LISTEN FOR UPDATES
// ========================================
function listenForUpdates() {
    try {
        if (typeof BroadcastChannel !== 'undefined') {
            const channel = new BroadcastChannel('namaz_updates');
            channel.onmessage = function(e) {
                if (e.data?.type === 'update') {
                    const hasChanges = document.querySelectorAll('.changed').length > 0;
                    if (!hasChanges && !isSaving) {
                        setStatus('📢 Update detected! Refreshing...', 'loading');
                        setTimeout(loadData, 500);
                    }
                }
            };
        }
    } catch (e) {}

    window.addEventListener('storage', function(e) {
        if (e.key === 'namaz_update_flag' && e.newValue === 'true') {
            localStorage.removeItem('namaz_update_flag');
            const hasChanges = document.querySelectorAll('.changed').length > 0;
            if (!hasChanges && !isSaving) {
                setStatus('📢 Update detected!', 'loading');
                setTimeout(loadData, 300);
            }
        }
    });
}

// ========================================
// AUTO REFRESH
// ========================================
let autoRefreshTimer = null;

function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => {
        const hasChanges = document.querySelectorAll('.changed').length > 0;
        if (!hasChanges && !isSaving) {
            loadData();
        }
    }, 30000);
}

// ========================================
// KEYBOARD SHORTCUTS
// ========================================
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveToFirebase(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'r') { e.preventDefault(); loadData(); }
});

// ========================================
// INIT
// ========================================
// Add change listeners
document.querySelectorAll('.time-item input, .friday-single input').forEach(input => {
    input.addEventListener('input', function() {
        this.classList.add('changed');
    });
    input.addEventListener('focus', function() { this.select(); });
});

listenForUpdates();
loadData();
startAutoRefresh();

console.log('⚡ Admin Panel - 1 Box + Jumma Box');
console.log('📌 Data URL:', DB_URL);
console.log('⌨️ Ctrl+S = Save | Ctrl+R = Refresh');
</script>

</body>
</html>
